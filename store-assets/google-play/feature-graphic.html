<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: "Noto Sans JP", "Yu Gothic UI", "BIZ UDPGothic", "Meiryo UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #2D2522;
  }

  .canvas {
    position: relative;
    width: 1024px;
    height: 500px;
    background:
      radial-gradient(circle at 74% 52%, rgba(242, 160, 126, 0.30) 0%, rgba(242, 160, 126, 0.08) 38%, rgba(242, 160, 126, 0) 68%),
      radial-gradient(circle at 14% 16%, rgba(255, 250, 244, 0.94) 0%, rgba(255, 250, 244, 0) 52%),
      linear-gradient(128deg, #FAF5EE 0%, #F6EDE2 52%, #EEDAC9 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px 0 48px;
  }

  /* 左カラム：ブランドロックアップ・コピー・特徴ピル */
  .left-col {
    position: relative;
    z-index: 2;
    width: 486px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 17px;
    margin-bottom: 24px;
  }

  .app-icon-wrap {
    width: 74px;
    height: 74px;
    border-radius: 18px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow:
      0 12px 24px rgba(176, 70, 44, 0.24),
      0 3px 8px rgba(130, 48, 28, 0.14);
  }
  .app-icon-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .brand-name {
    font-family: "Noto Sans", "Segoe UI Variable Display", "Noto Sans JP", sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.08;
    color: #2D2522;
  }
  .brand-sub {
    font-size: 13.5px;
    font-weight: 700;
    color: #C7593F;
    letter-spacing: 0.25px;
  }

  .headline {
    font-size: 33px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.4px;
    color: #2B2320;
    margin-bottom: 14px;
  }
  .headline .accent {
    color: #D86247;
  }

  .subcopy {
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.7;
    color: #6B5E56;
    margin-bottom: 24px;
  }

  .pills {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.93);
    border: 1px solid rgba(228, 216, 202, 0.85);
    box-shadow: 0 6px 16px rgba(107, 78, 61, 0.08);
    font-size: 12.5px;
    font-weight: 700;
    color: #3A302C;
    white-space: nowrap;
  }
  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  /* 右カラム：新アイコンの「重なる2枚カード＋4方向ティック」と響き合うビジュアル */
  .right-col {
    position: relative;
    width: 454px;
    height: 452px;
    flex-shrink: 0;
  }

  /* アイコンの4方向放射ティックをさりげなく踏襲（カードと各チップの間の空間に配置） */
  .motif-tick {
    position: absolute;
    background: rgba(224, 109, 83, 0.42);
    border-radius: 999px;
    z-index: 1;
  }
  .motif-tick.top {
    width: 5px;
    height: 15px;
    left: 224.5px;
    top: 72px;
  }
  .motif-tick.bottom {
    width: 5px;
    height: 15px;
    left: 224.5px;
    bottom: 72px;
  }
  .motif-tick.left {
    width: 12px;
    height: 5px;
    left: 92px;
    top: 223.5px;
  }
  .motif-tick.right {
    width: 12px;
    height: 5px;
    right: 88px;
    top: 223.5px;
  }

  /* 4方向の選択肢チップ */
  .dir-chip {
    position: absolute;
    z-index: 4;
    padding: 7px 14px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: 0 8px 18px rgba(72, 52, 42, 0.10);
    white-space: nowrap;
  }
  .dir-up {
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #CFE5D6;
    color: #2F593C;
    border: 1px solid #C2DEC9;
  }
  .dir-down {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #F6D0D7;
    color: #A83B4B;
    border: 1px solid #F2C3CC;
  }
  .dir-left {
    left: -18px;
    top: 50%;
    transform: translateY(-50%);
    background: #CCE0EF;
    color: #33587A;
    border: 1px solid #BFD7EA;
  }
  .dir-right {
    right: -18px;
    top: 50%;
    transform: translateY(-50%);
    background: #F6D8B4;
    color: #9B5816;
    border: 1px solid #F2CEA4;
  }

  /* 背面カード（アイコン左カードのクリームピーチ＋2本バーを呼応させたパートナーカード） */
  .card-back {
    position: absolute;
    left: 116px;
    top: 112px;
    width: 174px;
    height: 232px;
    border-radius: 24px;
    background: linear-gradient(155deg, #FEE9D2 0%, #F9D9B9 100%);
    border: 1.5px solid rgba(255, 250, 242, 0.88);
    transform: rotate(-12deg);
    box-shadow:
      0 18px 34px rgba(132, 62, 34, 0.16),
      0 4px 10px rgba(132, 62, 34, 0.08);
    padding: 24px 18px;
    z-index: 2;
  }
  .card-back-bar1 {
    width: 80px;
    height: 11px;
    border-radius: 999px;
    background: #E8BC96;
    margin-top: 28px;
    margin-bottom: 12px;
  }
  .card-back-bar2 {
    width: 54px;
    height: 11px;
    border-radius: 999px;
    background: #ECC6A3;
  }

  /* 前面カード（アプリのダークエスプレッソ質問カード＋右傾き） */
  .card-front {
    position: absolute;
    left: 144px;
    top: 102px;
    width: 196px;
    height: 246px;
    border-radius: 24px;
    background: linear-gradient(160deg, #3E332F 0%, #322926 100%);
    border: 1.5px solid #261E1C;
    transform: rotate(4.5deg);
    box-shadow:
      -10px 22px 38px rgba(45, 37, 34, 0.28),
      -3px 6px 12px rgba(45, 37, 34, 0.14);
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 3;
  }

  .card-tag {
    display: inline-flex;
    align-self: flex-start;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(242, 160, 126, 0.18);
    border: 1px solid rgba(242, 160, 126, 0.22);
    color: #F4B192;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .card-q {
    color: #FFFBF7;
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.48;
    letter-spacing: -0.2px;
    margin-top: -6px;
  }

  .card-footer {
    padding-top: 11px;
    border-top: 1px solid rgba(255, 255, 255, 0.11);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-footer-label {
    font-size: 10.5px;
    font-weight: 600;
    color: #D8C9BF;
    white-space: nowrap;
  }
  .card-match-pill {
    padding: 4px 10px;
    border-radius: 999px;
    background: linear-gradient(135deg, #E8785B 0%, #D96246 100%);
    color: #FFFFFF;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(224, 109, 83, 0.32);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="left-col">
      <div class="brand-row">
        <div class="app-icon-wrap">
          <img src="{{ICON_URI}}" alt="Kotaeai Icon" />
        </div>
        <div class="brand-text">
          <div class="brand-name">Kotaeai</div>
          <div class="brand-sub">コタエアイ — カップル・夫婦の価値観スワイプ</div>
        </div>
      </div>

      <h1 class="headline">
        1日3問、<span class="accent">4方向スワイプ</span>で<br />
        ふたりの本音が見えてくる。
      </h1>

      <p class="subcopy">
        お互いが答え終わって初めて結果がひらく。<br />
        毎日30秒の質問とAI相性診断で、ふたりの会話がもっと深まる。
      </p>

      <div class="pills">
        <div class="pill">
          <span class="pill-dot" style="background:#4A7C59;"></span>
          <span>双方回答でロック解除</span>
        </div>
        <div class="pill">
          <span class="pill-dot" style="background:#E06D53;"></span>
          <span>AI相性レポート</span>
        </div>
        <div class="pill">
          <span class="pill-dot" style="background:#C97A2B;"></span>
          <span>1人課金で2人共有</span>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="motif-tick top"></div>
      <div class="motif-tick bottom"></div>
      <div class="motif-tick left"></div>
      <div class="motif-tick right"></div>

      <div class="dir-chip dir-up">↑ おうちでまったり</div>
      <div class="dir-chip dir-left">← 旅行・遠出</div>
      <div class="dir-chip dir-right">カフェ巡り →</div>
      <div class="dir-chip dir-down">↓ 別々に自由時間</div>

      <div class="card-back">
        <div class="card-back-bar1"></div>
        <div class="card-back-bar2"></div>
      </div>

      <div class="card-front">
        <div class="card-tag">Q1 / 3・休日の過ごし方</div>
        <div class="card-q">理想の休日の<br />過ごし方は<br />どっち派？</div>
        <div class="card-footer">
          <span class="card-footer-label">2人同時に回答</span>
          <span class="card-match-pill">一致率 84%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
